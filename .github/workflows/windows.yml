name: Windows host

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.py'
      - 'tests/api_test.py'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host:
    # GitHub의 Windows 러너는 관리자 권한으로 돌기 때문에, 실제 .bat 실행 때와 같은 경로
    # (http://+:포트 수신, 방화벽 규칙 추가, 핫스팟 시도 → 무선랜이 없으니 우아하게 실패)를 검사합니다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build dist files
        run: python build.py

      - name: Start the Windows host like the .bat does, then run the API tests
        shell: powershell
        run: |
          $bat = Join-Path $PWD 'dist\SkyTalk-Windows.bat'
          $data = Join-Path $env:RUNNER_TEMP 'skytalk-data'
          $cmd = "`$s=[IO.File]::ReadAllText('$bat',[Text.Encoding]::UTF8); & ([ScriptBlock]::Create(`$s)) -Port 8080 -DataDir '$data' -NoBrowser"
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-Command',$cmd -RedirectStandardOutput host-out.txt -RedirectStandardError host-err.txt -PassThru
          $up = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8080/api/info; if ($r.StatusCode -eq 200) { $up = $true; break } } catch { }
            Start-Sleep -Seconds 1
          }
          Write-Host "---- host console ----"
          Get-Content host-out.txt -Encoding Default
          Get-Content host-err.txt -Encoding Default
          if (-not $up) { Write-Host "host did not start"; exit 1 }
          Write-Host "---- firewall rule ----"
          netsh advfirewall firewall show rule name=SkyTalk | Select-Object -First 12
          python tests/api_test.py url http://127.0.0.1:8080
          $rc = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          exit $rc
