name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/client.html'
      - 'build.py'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Put the chat page into the app
        run: python3 build.py

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.SKYTALK_KEY_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > android/app/skytalk-release.p12; fi

      - name: Build APK
        working-directory: android
        env:
          SKYTALK_KEY_PASS: ${{ secrets.SKYTALK_KEY_PASS }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/SkyTalk.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: SkyTalk-apk
          path: out/SkyTalk.apk

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SkyTalk-apk
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, run and test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tests/android_smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: emu-out/
